[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-itm"
version = "0.1.0"
description = "Detección de fraude y phishing en transacciones financieras mediante aprendizaje automático"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Cesar Enrique Diaz Maldonado" },
    { name = "José Antonio Medina Ayala" }
]
keywords = [
    "machine-learning",
    "fraud-detection",
    "phishing",
    "cybersecurity",
    "anomaly-detection",
    "behavioral-analysis",
    "crisp-dm"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    # Core data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",

    # Machine Learning
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "imbalanced-learn>=0.12.0",

    # Visualización
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Persistencia y BD
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",

    # Configuración
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",

    # Serialización de modelos
    "joblib>=1.3.0",

    # Logging y utilidades
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
    "types-PyYAML",
    "kaggle>=1.6.0"
]

[project.urls]
Homepage = "https://github.com/Cesaredmyt/fraud-detection-itm.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_detection = ["py.typed"]

# ===========================
# Ruff (linter + formatter)
# ===========================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF"  # ruff-specific
]
ignore = [
    "E501",  # line-too-long (ruff format se encarga)
    "B008"   # function call in default arg (pandas/sklearn lo usa)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]
"notebooks/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ===========================
# Pytest
# ===========================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=fraud_detection",
    "--cov-report=term-missing",
    "--cov-report=html"
]
markers = [
    "unit: marca tests unitarios rápidos",
    "integration: marca tests de integración (requieren BD)",
    "slow: marca tests que tardan más de 5s"
]

# ===========================
# Mypy
# ===========================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = "src"

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "xgboost.*",
    "imblearn.*",
    "matplotlib.*",
    "seaborn.*",
    "joblib.*"
]
ignore_missing_imports = true

# ===========================
# Coverage
# ===========================
[tool.coverage.run]
source = ["src/fraud_detection"]
omit = [
    "*/tests/*",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
