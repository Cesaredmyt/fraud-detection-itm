# Experimento 003: Los 4 modelos del protocolo sobre Credit Card
# Añade IsolationForest a la comparativa, completando el espectro
# supervisado + no supervisado.

experiment:
  name: "exp_003_creditcard_four_models"
  description: >
    Compara RulesBaseline, RandomForest, XGBoost e IsolationForest en
    Credit Card. Completa el set de modelos individuales del protocolo
    antes de implementar el modelo híbrido.
  notes: "Tercer experimento: añade el componente no supervisado."

dataset:
  name: "creditcard"
  feature_version: "v1"

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42

features:
  apply_temporal: true
  apply_amount: true
  apply_behavioral: false

resampling:
  method: "none"
  random_seed: 42

models:
  - name: "rules_baseline"
    type: "rule_based"
    config_file: "config/models/rules_baseline.yaml"

  - name: "random_forest"
    type: "supervised"
    config_file: "config/models/random_forest.yaml"

  - name: "xgboost"
    type: "supervised"
    config_file: "config/models/xgboost.yaml"

  - name: "isolation_forest"
    type: "unsupervised"
    config_file: "config/models/isolation_forest.yaml"

evaluation:
  splits:
    - "train"
    - "val"
  save_models: true
  save_json: true
  save_figures: true
  persist_to_db: true
