# Experimento 004: Replicación de la metodología sobre PaySim
# Aplica los 4 modelos individuales sobre PaySim usando un subset
# estratificado del 20% para acelerar la iteración.

experiment:
  name: "exp_004_paysim_four_models"
  description: >
    Replica la comparativa de 4 modelos (Reglas, RandomForest, XGBoost,
    IsolationForest) sobre PaySim. Usa subset estratificado del 20%
    para iteración rápida durante desarrollo; la evaluación final se hará
    sobre el dataset completo.
  notes: "Replicación cross-dataset de la hipótesis del proyecto."

dataset:
  name: "paysim"
  feature_version: "v1"
  sample_fraction: 0.20

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42

features:
  apply_temporal: true
  apply_amount: true
  apply_behavioral: true # PaySim sí soporta features conductuales

resampling:
  method: "none"
  random_seed: 42

models:
  - name: "rules_baseline"
    type: "rule_based"
    config_file: "config/models/rules_baseline.yaml"

  - name: "random_forest"
    type: "supervised"
    config_file: "config/models/random_forest.yaml"

  - name: "xgboost"
    type: "supervised"
    config_file: "config/models/xgboost.yaml"

  - name: "isolation_forest"
    type: "unsupervised"
    config_file: "config/models/isolation_forest.yaml"

evaluation:
  splits:
    - "train"
    - "val"
  save_models: true
  save_json: true
  save_figures: true
  persist_to_db: true
