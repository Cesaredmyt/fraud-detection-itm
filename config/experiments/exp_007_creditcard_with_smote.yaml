# Experimento 007: Impacto de SMOTE sobre los 4 modelos + hibrido en Credit Card
# Reusa la configuracion de exp_005 cambiando resampling.method de "none"
# a "smote". Permite cuantificar el impacto del oversampling sintetico
# en recall (y precision) sin tocar ningun otro hiperparametro.

experiment:
  name: "exp_007_creditcard_with_smote"
  description: >
    Aplica SMOTE al conjunto de entrenamiento de Credit Card y reentrena
    los 4 modelos individuales + hibrido. Pregunta clave: SMOTE mejora
    recall? A que costo en precision?
  notes: "Ablation de SMOTE. SMOTE se aplica EXCLUSIVAMENTE en train."

dataset:
  name: "creditcard"
  feature_version: "v1"

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42

features:
  apply_temporal: true
  apply_amount: true
  apply_behavioral: false

resampling:
  method: "smote"
  random_seed: 42

models:
  - name: "rules_baseline"
    type: "rule_based"
    config_file: "config/models/rules_baseline.yaml"

  - name: "random_forest"
    type: "supervised"
    config_file: "config/models/random_forest.yaml"

  - name: "xgboost"
    type: "supervised"
    config_file: "config/models/xgboost.yaml"

  - name: "isolation_forest"
    type: "unsupervised"
    config_file: "config/models/isolation_forest.yaml"

  - name: "hybrid"
    type: "hybrid"
    config_file: "config/models/hybrid.yaml"

evaluation:
  splits:
    - "train"
    - "val"
  save_models: true
  save_json: true
  save_figures: true
  persist_to_db: true
