# Experimento 004b: Variante de exp_004 SIN la columna `isFlaggedFraud`
# isFlaggedFraud es la bandera nativa del simulador (derivable de amount>200k
# y type='TRANSFER'). Aunque no es ground truth, su presencia simplifica el
# problema. Esta variante mide el rendimiento "puro" con features derivadas.

experiment:
  name: "exp_004b_paysim_four_models_no_flagged"
  description: >
    Variante de exp_004 que excluye la columna `isFlaggedFraud` de X.
    Comparativa con exp_004 permite cuantificar cuánto del rendimiento de
    los modelos en PaySim depende de esa bandera derivada del simulador.
  notes: "Variante sin isFlaggedFraud para evaluar dependencia del feature."

dataset:
  name: "paysim"
  feature_version: "v1"
  sample_fraction: 0.20
  exclude_columns:
    - "isFlaggedFraud"

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42

features:
  apply_temporal: true
  apply_amount: true
  apply_behavioral: true

resampling:
  method: "none"
  random_seed: 42

models:
  - name: "rules_baseline"
    type: "rule_based"
    config_file: "config/models/rules_baseline.yaml"

  - name: "random_forest"
    type: "supervised"
    config_file: "config/models/random_forest.yaml"

  - name: "xgboost"
    type: "supervised"
    config_file: "config/models/xgboost.yaml"

  - name: "isolation_forest"
    type: "unsupervised"
    config_file: "config/models/isolation_forest.yaml"

evaluation:
  splits:
    - "train"
    - "val"
  save_models: true
  save_json: true
  save_figures: true
  persist_to_db: true
