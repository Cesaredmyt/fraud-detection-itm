# Experimento 006: Modelo hibrido sobre PaySim
# Replica exp_004 sumando el modelo hibrido para evaluar si la
# combinacion supera a XGBoost solo (que ya satura en F1=0.998 sobre val).

experiment:
  name: "exp_006_paysim_hybrid"
  description: >
    Anade el modelo hibrido al ranking de modelos individuales de PaySim
    (exp_004). Usa subset estratificado del 20% como exp_004.
  notes: "Validacion cross-dataset del hibrido. Excluye isFlaggedFraud por consistencia con exp_004b."

dataset:
  name: "paysim"
  feature_version: "v1"
  sample_fraction: 0.20
  exclude_columns:
    - "isFlaggedFraud"

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42

features:
  apply_temporal: true
  apply_amount: true
  apply_behavioral: true

resampling:
  method: "none"
  random_seed: 42

models:
  - name: "rules_baseline"
    type: "rule_based"
    config_file: "config/models/rules_baseline.yaml"

  - name: "random_forest"
    type: "supervised"
    config_file: "config/models/random_forest.yaml"

  - name: "xgboost"
    type: "supervised"
    config_file: "config/models/xgboost.yaml"

  - name: "isolation_forest"
    type: "unsupervised"
    config_file: "config/models/isolation_forest.yaml"

  - name: "hybrid"
    type: "hybrid"
    config_file: "config/models/hybrid.yaml"

evaluation:
  splits:
    - "train"
    - "val"
  save_models: true
  save_json: true
  save_figures: true
  persist_to_db: true
