# Experimento 002: Comparativa de 3 modelos sobre Credit Card
# Añade XGBoost a la comparativa Reglas vs Random Forest.

experiment:
  name: "exp_002_creditcard_three_models"
  description: >
    Compara RulesBaseline, RandomForest y XGBoost en Credit Card.
    Sin SMOTE. Configuración por defecto del proyecto.
  notes: "Segundo experimento: incorpora XGBoost al pipeline."

dataset:
  name: "creditcard"
  feature_version: "v1"

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42

features:
  apply_temporal: true
  apply_amount: true
  apply_behavioral: false

resampling:
  method: "none"
  random_seed: 42

models:
  - name: "rules_baseline"
    type: "rule_based"
    config_file: "config/models/rules_baseline.yaml"

  - name: "random_forest"
    type: "supervised"
    config_file: "config/models/random_forest.yaml"

  - name: "xgboost"
    type: "supervised"
    config_file: "config/models/xgboost.yaml"

evaluation:
  splits:
    - "train"
    - "val"
  save_models: true
  save_json: true
  save_figures: true
  persist_to_db: true
