model:
  name: "xgboost"
  type: "supervised"
  library: "xgboost"
  class: "xgboost.XGBClassifier"

hyperparameters:
  n_estimators: 300
  max_depth: 8
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 1
  eval_metric: "aucpr"
  random_state: 42
  n_jobs: -1
  tree_method: "hist"

tuning:
  enabled: false
  search_method: "random"
  n_iter: 50
  cv_folds: 5
  scoring: "f1"