model:
  name: "random_forest"
  type: "supervised"
  library: "scikit-learn"
  class: "sklearn.ensemble.RandomForestClassifier"

hyperparameters:
  n_estimators: 200
  max_depth: 20
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: "sqrt"
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1

tuning:
  enabled: false
  search_method: "random"
  n_iter: 50
  cv_folds: 5
  scoring: "f1"