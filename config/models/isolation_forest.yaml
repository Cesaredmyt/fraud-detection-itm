model:
  name: "isolation_forest"
  type: "unsupervised"
  library: "scikit-learn"
  class: "sklearn.ensemble.IsolationForest"

hyperparameters:
  n_estimators: 200
  max_samples: "auto"
  contamination: "auto"
  max_features: 1.0
  bootstrap: false
  random_state: 42
  n_jobs: -1

tuning:
  enabled: false